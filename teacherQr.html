<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Giám Sát Thi P2P - Thầy Nguyễn Hoàng Hải Đăng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <!-- Thư viện tạo mã QR tự động -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 flex flex-col">

  <!-- HEADER ĐIỀU KHIỂN -->
  <header class="bg-slate-900 border border-slate-800 rounded-xl p-3 mb-3 flex flex-wrap justify-between items-center gap-2 shadow-lg">
    <div>
      <h1 class="text-sm sm:text-base font-black text-indigo-400 uppercase tracking-tight flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        HỆ THỐNG GIÁM SÁT THI TRỰC TUYẾN P2P SERVERLESS (46 HỌC SINH)[cite: 5]
      </h1>
      <p class="text-xs text-slate-400">Giáo viên: <strong>Nguyễn Hoàng Hải Đăng</strong> • Đơn vị: Trường THPT Bình Tân[cite: 1, 5]</p>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <!-- Bộ lọc lớp -->
      <select id="filterClass" onchange="renderGridByClass()" class="bg-slate-800 border border-slate-700 text-indigo-300 font-bold text-xs px-2.5 py-1.5 rounded-lg outline-none">
        <option value="ALL">Tất cả lớp</option>
        <option value="12A3" selected>Lớp 12A3</option>
        <option value="12A9">Lớp 12A9</option>
        <option value="12A14">Lớp 12A14</option>
      </select>

      <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs">
        Đang online: <strong id="onlineCount" class="text-emerald-400">0</strong> / 46 học sinh[cite: 5]
      </div>

      <!-- Nút mở mã QR chiếu lên máy chiếu -->
      <button onclick="toggleQRModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3.5 py-1.5 rounded-lg transition shadow flex items-center gap-1.5">
        📱 Mã QR Vào Thi
      </button>

      <!-- Nút xuất file Excel điểm số -->
      <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-1.5 rounded-lg transition shadow flex items-center gap-1.5">
        📊 Xuất Điểm Excel Chuẩn[cite: 5]
      </button>
    </div>
  </header>

  <!-- LƯỚI KHUNG HÌNH NHỎ CHỨA ĐỦ 46 EM (8 CỘT X 6 HÀNG) -->
  <main class="flex-1 bg-slate-900/60 border border-slate-800 rounded-xl p-2 overflow-y-auto">
    <div id="videoGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2">
      <!-- 46 ô video sẽ hiển thị tại đây -->
    </div>
  </main>

  <!-- MODAL PHÓNG TO MÃ QR CHIẾU LÊN MÁY CHIẾU PHÒNG HỌC -->
  <div id="qrModal" class="hidden fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
    <div class="bg-white text-slate-900 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl relative border-2 border-indigo-600">
      <button onclick="toggleQRModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none">&times;</button>
      <h3 class="text-sm font-black text-indigo-950 uppercase">QUÉT MÃ QR ĐỂ VÀO BÀI THI</h3>
      <p class="text-xs text-slate-500 mt-1 mb-3">Học sinh mở camera hoặc Zalo quét mã để truy cập ngay:</p>
      
      <div id="qrcodeBox" class="flex justify-center my-2 p-3 bg-slate-50 border rounded-xl"></div>
      
      <p id="examUrlText" class="text-[11px] font-mono text-indigo-600 break-all mt-3 bg-indigo-50 p-2 rounded border font-semibold"></p>
      
      <button onclick="toggleQRModal()" class="mt-4 w-full py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-lg transition">Đóng Cửa Sổ</button>
    </div>
  </div>

  <script>
    const studentData = {};
    const maxStudents = 46;
    let qrGenerated = false;

    // Khởi tạo lưới 46 ô
    function initGrid() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= maxStudents; i++) {
        const card = document.createElement('div');
        card.id = `seat-${i}`;
        card.className = "bg-slate-950 border border-slate-800 rounded-lg p-1 flex flex-col justify-between items-center aspect-video relative";
        card.innerHTML = `
          <div class="w-full flex justify-between items-center text-[9px] px-1 text-slate-400">
            <span class="font-bold">#${i}</span>
            <span id="name-${i}" class="truncate max-w-[80px]">Chờ kết nối...</span>
          </div>
          <div class="w-full h-full flex items-center justify-center bg-slate-900/80 rounded my-0.5 overflow-hidden relative">
            <video id="vid-${i}" autoplay playsinline class="w-full h-full object-cover hidden"></video>
            <span id="holder-${i}" class="text-[10px] text-slate-600 font-mono">OFFLINE</span>
            <span id="violation-tag-${i}" class="hidden absolute top-1 right-1 bg-rose-600 text-white font-bold text-[8px] px-1 rounded animate-bounce">RỜI TAB</span>
          </div>
          <div class="w-full flex justify-between text-[8px] text-slate-500 px-1 font-mono">
            <span id="score-${i}">-- đ</span>
            <span id="status-${i}">⚪</span>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    initGrid();

    // Mở / Đóng Modal Mã QR phòng thi
    function toggleQRModal() {
      const modal = document.getElementById('qrModal');
      modal.classList.toggle('hidden');

      if (!modal.classList.contains('hidden') && !qrGenerated) {
        const currentUrl = window.location.href;
        const examUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + '/index.html';
        
        document.getElementById('examUrlText').innerText = examUrl;
        
        new QRCode(document.getElementById("qrcodeBox"), {
          text: examUrl,
          width: 220,
          height: 220,
          colorDark : "#0f172a",
          colorLight : "#ffffff",
          correctLevel : QRCode.CorrectLevel.H
        });
        qrGenerated = true;
      }
    }

    // Khởi tạo Peer ID giáo viên
    const peer = new Peer('thptbt-teacher-room', { debug: 1 });

    peer.on('open', (id) => {
      console.log('Teacher Dashboard sẵn sàng với ID:', id);
    });

    // Nhận cuộc gọi camera WebRTC từ học sinh[cite: 5]
    peer.on('call', (call) => {
      call.answer();
      const meta = call.metadata || {};
      const stt = parseInt(meta.stt);
      const studentClass = meta.className || "12A3";

      call.on('stream', (remoteStream) => {
        if (stt && stt <= maxStudents) {
          const vid = document.getElementById(`vid-${stt}`);
          const holder = document.getElementById(`holder-${stt}`);
          const nameSpan = document.getElementById(`name-${stt}`);
          const statusSpan = document.getElementById(`status-${stt}`);

          if (vid) {
            vid.srcObject = remoteStream;
            vid.classList.remove('hidden');
            holder.classList.add('hidden');
            nameSpan.innerText = meta.name || `HS ${stt}`;
            statusSpan.innerText = "🟢";
          }

          studentData[stt] = {
            stt: stt,
            name: meta.name || `Học sinh ${stt}`,
            className: studentClass,
            startTime: new Date().toLocaleTimeString('vi-VN'),
            submitTime: "--",
            score: 0,
            violations: 0
          };
          updateOnlineCount();
        }
      });
    });

    // Nhận dữ liệu text (vi phạm & nộp bài)
    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        const stt = parseInt(data.stt);
        if (!stt) return;

        // Báo cờ đỏ rời tab[cite: 5]
        if (data.type === 'violation') {
          const vTag = document.getElementById(`violation-tag-${stt}`);
          if (vTag) {
            vTag.classList.remove('hidden');
            setTimeout(() => vTag.classList.add('hidden'), 3500);
          }
          if (studentData[stt]) {
            studentData[stt].violations = data.violations;
          }
        }

        // Nhận kết quả nộp bài[cite: 5]
        if (data.type === 'submit') {
          const scoreElem = document.getElementById(`score-${stt}`);
          const statusElem = document.getElementById(`status-${stt}`);
          if (scoreElem) scoreElem.innerText = `${data.score} đ`;
          if (statusElem) statusElem.innerText = "✅";

          studentData[stt] = {
            stt: stt,
            name: data.name,
            className: data.className,
            startTime: data.startTime,
            submitTime: data.submitTime,
            score: parseFloat(data.score),
            violations: data.violations
          };
        }
      });
    });

    function updateOnlineCount() {
      document.getElementById('onlineCount').innerText = Object.keys(studentData).length;
    }

    // Xuất file Excel bảng điểm chuẩn[cite: 5]
    function exportToExcel() {
      const selectedClass = document.getElementById('filterClass').value;
      const rows = [];
      rows.push(["STT", "Họ và tên", "Lớp", "Thời gian làm bài", "Thời gian nộp bài", "Điểm số", "Số lần vi phạm"]);

      for (let i = 1; i <= maxStudents; i++) {
        if (studentData[i]) {
          const s = studentData[i];
          if (selectedClass === "ALL" || s.className === selectedClass) {
            rows.push([s.stt, s.name, s.className, s.startTime, s.submitTime, s.score, s.violations]);
          }
        }
      }

      if (rows.length === 1) {
        alert("Chưa có dữ liệu học sinh làm bài để xuất file!");
        return;
      }

      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Bang_Diem");
      const fileName = selectedClass === "ALL" 
        ? "Bang_Diem_Kiem_Tra_Tat_Ca_Lop.xlsx" 
        : `Bang_Diem_Kiem_Tra_${selectedClass}.xlsx`;
      XLSX.writeFile(wb, fileName);
    }
  </script>
</body>
</html>
